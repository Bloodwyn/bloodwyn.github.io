<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="/styles.css">
  <style>
    #container { position: relative; }

    /* ── column header bar (flex row, pans only horizontally) ── */
    #col-header-bar {
      flex: 0 0 auto;
      height: 36px;
      overflow: hidden;
      pointer-events: none;
      background: #333;
      position: relative;
    }
    #col-header-inner {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
    }
    .col-header-cell {
      position: absolute;
      top: 0; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #333; color: #fff;
      font-size: .85rem; font-weight: 700;
      letter-spacing: .04em;
      border-right: 1px solid #555;
      white-space: nowrap;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* ── map column (header bar + map shell stacked) ── */
    #map-col {
      flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0;
    }

    /* ── map shell ── */
    #map-shell {
      flex: 1;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      background: #efefef;
      position: relative;
      touch-action: none;
    }
    #map-shell.dragging { cursor: grabbing; }

    /* ── column stripe underlay ── */
    #col-stripes {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      display: flex;
      pointer-events: none;
    }
    .col-stripe {
      flex: 0 0 auto;
      position: relative;
    }

    /* ── grid canvas ── */
    #canvas {
      display: grid;
      position: absolute;
      top: 0; left: 0;
      align-items: start;
    }

    /* ── row cells ── */
    .row-cell {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    /* ── cards ── */
    .card {
      border-radius: 6px;
      padding: 11px 13px;
      box-shadow: 0 1px 5px rgba(0,0,0,.13);
      cursor: pointer;
      transition: box-shadow .15s, transform .1s;
      border-left: 5px solid transparent;
      box-sizing: border-box;
    }
    .card:hover {
      box-shadow: 0 4px 18px rgba(0,0,0,.22);
      transform: translateY(-2px);
    }
    .card-name, .card-tag {
      font-size: .78rem; font-weight: 700;
      line-height: 1.35; color: #111;
    }
    .card-tag { color: #666; }
    .card-diff {
      font-size: .73rem; color: #333; line-height: 1.38;
      margin-top: 5px;
    }



    /* ── row label sidebar ── */
    #row-label-col {
      flex: 0 0 auto;
      width: 110px;
      display: flex;
      flex-direction: column;
      background: #3a3a3a;
      overflow: hidden;
      position: relative;
      border-right: 1px solid #555;
    }
    #row-label-header {
      flex: 0 0 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #333;
      color: #999;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .05em;
      white-space: nowrap;
      border-bottom: 1px solid #555;
    }
    #row-label-inner {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    #row-label-canvas {
      position: absolute;
      top: 0; left: 0; right: 0;
    }
    .row-label-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      color: #aaa;
      font-size: .68rem;
      font-weight: 500;
      letter-spacing: .03em;
      text-align: center;
      line-height: 1.35;
      border-bottom: 1px solid #484848;
      box-sizing: border-box;
    }
    /* Spacers: reserve grid height only, no visuals (the overlay draws the bar) */
    #canvas-sep-row { height: 20px; }
    .row-label-sep-cell { height: 20px; }

    /* Single overlay bar spanning the row-label column + the canvas */
    #overlap-bar {
      position: absolute;
      left: 0; right: 0;
      height: 20px;
      background: #e0e0e0;
      border-top: 1px solid #888;
      border-bottom: 1px solid #888;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }
    #sep-label {
      position: absolute;
      top: 0; height: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      color: #777;
      font-size: .73rem;
      font-weight: 500;
      letter-spacing: .07em;
      white-space: nowrap;
      transform: translateX(-50%);
    }
    .row-label-cell:has(+ .row-label-sep-cell) {
      border-bottom: none;
    }

    #drag-hint {
      position: fixed; bottom: 14px; left: 50%;
      transform: translateX(-50%);
      font-size: .75rem; color: #bbb;
      pointer-events: none; z-index: 50;
      transition: opacity 1s;
    }
    #drag-hint.hidden { opacity: 0; }

    /* Keep the map layout intact on mobile: the global stylesheet stacks
       #container into a column, which hides the row-label sidebar. */
    @media (max-width: 720px) and (orientation: portrait) {
      #topbar { flex: 0 0 auto; }
      /* Sidebar keeps the site-wide mobile styling (full-width strip). Grid puts
         the label column + map on top and the sidebar strip at the bottom,
         matching publications.html where the content sits above the sidebar. */
      #container {
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-rows: 1fr auto;
      }
      #row-label-col { grid-column: 1; grid-row: 1; width: 84px; }
      #map-col { grid-column: 2; grid-row: 1; min-width: 0; }
      .sidebar { grid-column: 1 / 3; grid-row: 2; }
      #col-header-bar { height: 28px; }
      .col-header-cell { font-size: .68rem; letter-spacing: .02em; }
      #row-label-header { flex: 0 0 28px; font-size: .6rem; }
      .row-label-cell { font-size: .6rem; }
    }
  </style>
</head>

    info: `An <span style="font-weight:600">Execution Graph</span> is a <span style="font-weight:600">DAG</span> of shaders where edges define which nodes can create work for others. Work can be parametrized with a <span style="font-weight:600">small payload</span> and created as <span style="font-weight:600">per thread</span>, <span style="font-weight:600">multiple threads in a group</span>, or as a whole <span style="font-weight:600">static or dynamic grid</span>. Launched <span style="font-weight:600">children</span> can <span style="font-weight:600">overlap</span> with parent execution. <span style="font-weight:600">AMD-only, provisional</span>.`,
  },

  // ── HIP placeholder ──────────────────────────────────────────────────────
  {
    col: 'hip', cat: 'placeholder', yBand: 4,
    url: 'https://rocm.docs.amd.com/projects/HIP/en/latest/',
    name: '<span style="color:#aaa;font-style:italic;font-weight:normal;display:block;text-align:center">Page intentionally left blank.</span>',
    version: '',
    info: '',
  },

  // ── Mantle (AMD, historical) ─────────────────────────────────────────────
  {

    info: `<span style="font-weight:600">One</span> CPU call issues <span style="font-weight:600">one</span> dispatch for the <span style="font-weight:600">current</span> pipeline using size arguments from a <span style="font-weight:600">GPU buffer</span>.`,

    info: `One GPU task/amplification thread group emits <span style="font-weight:600">one</span> <span style="font-weight:600">dynamic</span> dispatch grid of <span style="font-weight:600">mesh thread groups</span> together with a <span style="font-weight:600">small payload</span>.`,

  {
    col: 'pal', cat: 'work-graphs', yBand: 8,
    url: 'https://github.com/GPUOpen-Drivers/pal',

    info: `An <span style="font-weight:600">Execution Graph</span> is a <span style="font-weight:600">DAG</span> of shaders where edges define which nodes can create work for others. Work can be parametrized with a <span style="font-weight:600">small payload</span> and created as <span style="font-weight:600">per thread</span>, <span style="font-weight:600">multiple threads in a group</span>, or as a whole <span style="font-weight:600">static or dynamic grid</span>. Launched <span style="font-weight:600">children</span> can <span style="font-weight:600">overlap</span> with parent execution. Internal substrate beneath VK_AMDX_shader_enqueue and D3D12 Work Graphs.`,
  },

// ─────────────────────────────────────────────────────────────────────────────
// LAYOUT
// ─────────────────────────────────────────────────────────────────────────────
const COL_W = 300;

const BAND_LABELS = [
  'GPU-Driven\nDispatch\nControl Flow',     // 0
  'Single\nIndirect',             // 1
  'Multi\nIndirect',              // 2
  'Dynamic Multi\nIndirect',      // 3
  'Dynamic Multi Indirect\nwith Bindings', // 4
  'Device Generated\nCommands',   // 5
  'Command Buffer\nControl Flow', // 6
  'Mesh\nShaders',                // 7
  'Work\nGraphs',                 // 8
  'Device-Side\nKernel Launch',   // 9
];

// ─────────────────────────────────────────────────────────────────────────────
// BUILD DOM
// ─────────────────────────────────────────────────────────────────────────────
const shell          = document.getElementById('map-shell');
const canvas         = document.getElementById('canvas');
const colStripes     = document.getElementById('col-stripes');
const colHeaderInner = document.getElementById('col-header-inner');
const rowLabelCanvas = document.getElementById('row-label-canvas');

const totalW  = COLS.length * COL_W;
const maxBand = Math.max(...cards.map(c => c.yBand));
const numRows = maxBand + 1;
const colHeaderCells = [];

// Grid: one column per API, one row per yBand
canvas.style.position = 'absolute';
canvas.style.top = '0';
canvas.style.left = '0';
canvas.style.width = totalW + 'px';
// yBand 7+ are shifted by 1 to make room for the separator row after yBand 6
const SEP_AFTER_BAND = 6;
const SEP_GRID_ROW   = SEP_AFTER_BAND + 2; // 1-based grid row of the separator
const SEP_BASE_H     = 20;    // px, unscaled height of the separator row
const SEP_BASE_FONT  = 0.73;  // rem, unscaled label font size
function bandToGridRow(band) {
  return band <= SEP_AFTER_BAND ? band + 1 : band + 2;
}
const gridRows = numRows + 1; // one extra for the separator

canvas.style.gridTemplateColumns = COLS.map(() => COL_W + 'px').join(' ');
canvas.style.gridTemplateRows    = Array.from({length: gridRows}, () => 'auto').join(' ');

// Column header cells
COLS.forEach(col => {
  const cell = document.createElement('div');
  cell.className = 'col-header-cell';
  cell.style.width = COL_W + 'px';
  cell.textContent = col.label;
  colHeaderCells.push(cell);
  colHeaderInner.appendChild(cell);
});

// Column stripe underlay (positioned absolutely, full canvas height after layout)
colStripes.style.width = totalW + 'px';
COLS.forEach((col, ci) => {
  const stripe = document.createElement('div');
  stripe.className = 'col-stripe';
  stripe.style.width = COL_W + 'px';
  stripe.style.borderRight = '1px solid #ddd';
  stripe.style.background  = ci % 2 === 0 ? 'rgba(255,255,255,.6)' : 'rgba(232,232,232,.5)';
  colStripes.appendChild(stripe);
});

// Bucket cards by grid cell
const byCell = {};
cards.forEach(c => {
  const key = c.col + '|' + c.yBand;
  if (!byCell[key]) byCell[key] = [];
  byCell[key].push(c);
});

// Separator row spanning all columns
const sepRow = document.createElement('div');
sepRow.id = 'canvas-sep-row';
sepRow.style.gridColumn = `1 / ${COLS.length + 1}`;
sepRow.style.gridRow    = String(SEP_GRID_ROW);
canvas.appendChild(sepRow);

// Create one row-cell div per grid cell (even empty ones, to keep grid alignment)
for (let row = 0; row < numRows; row++) {
  COLS.forEach((col, ci) => {
    const cell = document.createElement('div');
    cell.className = 'row-cell';
    cell.style.gridColumn = (ci + 1) + '';
    cell.style.gridRow    = String(bandToGridRow(row));

    const key = col.id + '|' + row;
    const cellCards = byCell[key] || [];
    cellCards.forEach(c => {
      const cat = CATS[c.cat];
      const div = document.createElement('div');
      div.className = 'card';
      div.style.borderLeftColor = cat.color;
      div.style.background      = cat.bg;
      div.innerHTML =
        `<div class="card-name">${c.name}</div>` +
        (c.version  ? `<div class="card-tag">${c.version}</div>`   : '') +
        (c.info ? `<div class="card-diff">${c.info}</div>` : '');
      div.addEventListener('click', () => { if (!moved) window.open(c.url, '_blank'); });
      cell.appendChild(div);
    });

    canvas.appendChild(cell);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// PANNING + ZOOMING
// ─────────────────────────────────────────────────────────────────────────────
let panX = 0, panY = 0, scale = 1;
let dragging = false, moved = false;
let startX = 0, startY = 0, startPanX = 0, startPanY = 0;
let totalH = 0;
const MAX_SCALE = 2.5;
let baseRowHeights = [];

function fitScale() {
  return Math.min(shell.clientWidth / totalW, shell.clientHeight / totalH);
}

function clampPan() {
  const shellW = shell.clientWidth;
  const shellH = shell.clientHeight;
  panX = Math.max(Math.min(0, shellW - totalW * scale), Math.min(0, panX));
  panY = Math.max(Math.min(0, shellH - totalH * scale), Math.min(0, panY));
}

canvas.style.transformOrigin     = '0 0';
colStripes.style.transformOrigin = '0 0';

function applyPan() {
  canvas.style.transform     = `translate(${panX}px,${panY}px) scale(${scale})`;
  colStripes.style.transform = `translateX(${panX}px) scaleX(${scale})`;

  const cellW = COL_W * scale;
  colHeaderCells.forEach((cell, i) => {
    cell.style.left  = (panX + i * cellW) + 'px';
    cell.style.width = cellW + 'px';
  });

  rowLabelCanvas.style.transform = `translateY(${panY}px)`;
  rowLabelCanvas.querySelectorAll('.row-label-cell, .row-label-sep-cell').forEach(cell => {
    cell.style.height = (parseFloat(cell.dataset.baseH) * scale) + 'px';
  });

  positionOverlapBar();
}

function positionOverlapBar() {
  const bar = document.getElementById('overlap-bar');
  if (!bar || !baseRowHeights.length) return;

  const container = document.getElementById('container');
  const contRect  = container.getBoundingClientRect();
  const shellRect = shell.getBoundingClientRect();

  // The spacer rows scale with the canvas, so the bar must match (20px base).
  const barH = SEP_BASE_H * scale;
  bar.style.height = barH + 'px';

  // Vertical: sum scaled heights of the bands above the separator, offset by panY,
  // relative to the shell's top inside the container.
  const bandsAbove = baseRowHeights.slice(0, SEP_AFTER_BAND + 1)
                                   .reduce((s, h) => s + h * scale, 0);
  const top = (shellRect.top - contRect.top) + panY + bandsAbove;
  bar.style.top = top + 'px';

  // Horizontal: span from the row-label column's left edge to the container's right edge.
  const labelColRect = document.getElementById('row-label-col').getBoundingClientRect();
  bar.style.left  = (labelColRect.left - contRect.left) + 'px';
  bar.style.right = '0';

  // Hide the bar if it has scrolled out of the shell's vertical viewport.
  const shellTopInCont = shellRect.top - contRect.top;
  const shellBotInCont = shellRect.bottom - contRect.top;
  bar.style.display = (top + barH < shellTopInCont || top > shellBotInCont) ? 'none' : 'block';

  // Center the label within the visible canvas area (to the right of the label column).
  const sepLabel = document.getElementById('sep-label');
  if (sepLabel) {
    sepLabel.style.fontSize = (SEP_BASE_FONT * scale) + 'rem';
    const canvasLeftInBar   = shellRect.left - labelColRect.left;
    const visibleCanvasW    = shellRect.width;
    sepLabel.style.left = (canvasLeftInBar + visibleCanvasW / 2) + 'px';
  }
}

window.addEventListener('DOMContentLoaded', () => {
  // After layout, measure actual canvas height for clamp
  totalH = canvas.scrollHeight;

  // Build row label cells matching canvas row heights.
  // Group all .row-cell elements by their gridRow value, then take the
  // tallest measured height in each group (in a CSS grid every cell in the
  // same row gets the same height, so any cell works, but taking the max is
  // robust against sub-pixel rounding and any edge cases).
  const rowHeights = {};
  canvas.querySelectorAll('.row-cell').forEach(cell => {
    const rowKey = cell.style.gridRow;
    const h = cell.getBoundingClientRect().height;
    rowHeights[rowKey] = Math.max(rowHeights[rowKey] || 0, h);
  });

  for (let row = 0; row < numRows; row++) {
    const gridRow = bandToGridRow(row);
    const h = rowHeights[String(gridRow)] || 0;
    baseRowHeights.push(h);

    if (row === SEP_AFTER_BAND + 1) {
      const sepCell = document.createElement('div');
      sepCell.className = 'row-label-sep-cell';
      sepCell.dataset.baseH = SEP_BASE_H;
      rowLabelCanvas.appendChild(sepCell);
    }

    const label = document.createElement('div');
    label.className = 'row-label-cell';
    label.dataset.baseH = h;
    label.style.height = h + 'px';
    label.innerHTML = (BAND_LABELS[row] || '').replace(/\n/g, '<br>');
    rowLabelCanvas.appendChild(label);
  }

  const shellW = shell.clientWidth;
  panX = totalW < shellW ? Math.round((shellW - totalW) / 2) : 0;
  panY = 0;
  clampPan();
  applyPan();

});

window.addEventListener('resize', () => {
  // Never leave the map below its fit-to-screen floor after a viewport change.
  scale = Math.max(scale, fitScale());
  const shellW = shell.clientWidth;
  if (totalW * scale < shellW) panX = Math.round((shellW - totalW * scale) / 2);
  clampPan();
  applyPan();
});

// Mouse
shell.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  dragging = true; moved = false;
  startX = e.clientX; startY = e.clientY;
  startPanX = panX; startPanY = panY;
  shell.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - startX, dy = e.clientY - startY;
  if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
  panX = startPanX + dx; panY = startPanY + dy;
  clampPan(); applyPan();
});
window.addEventListener('mouseup', () => {
  dragging = false;
  shell.classList.remove('dragging');
});

// Touch: single-finger pan + two-finger pinch-zoom
let t0 = null, t1 = null, startScale = 1, pinchMidX = 0, pinchMidY = 0;

function touchDist(a, b) {
  const dx = a.clientX - b.clientX, dy = a.clientY - b.clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

shell.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    t0 = e.touches[0]; t1 = null; moved = false;
    startPanX = panX; startPanY = panY;
  } else if (e.touches.length === 2) {
    t0 = e.touches[0]; t1 = e.touches[1];
    startScale = scale;
    startPanX  = panX; startPanY = panY;
    const rect = shell.getBoundingClientRect();
    pinchMidX  = (t0.clientX + t1.clientX) / 2 - rect.left;
    pinchMidY  = (t0.clientY + t1.clientY) / 2 - rect.top;
  }
  e.preventDefault();
}, { passive: false });

shell.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 2 && t1) {
    const a = e.touches[0], b = e.touches[1];
    const dist0 = touchDist(t0, t1);
    const dist1 = touchDist(a,  b);
    const newScale = Math.max(fitScale(), Math.min(MAX_SCALE, startScale * dist1 / dist0));
    const ratio    = newScale / startScale;
    const rect     = shell.getBoundingClientRect();
    const curMidX  = (a.clientX + b.clientX) / 2 - rect.left;
    const curMidY  = (a.clientY + b.clientY) / 2 - rect.top;
    panX   = curMidX - ratio * (pinchMidX - startPanX);
    panY   = curMidY - ratio * (pinchMidY - startPanY);
    scale  = newScale;
    clampPan(); applyPan();
    moved = true;
  } else if (e.touches.length === 1 && t0 && !t1) {
    const dx = e.touches[0].clientX - t0.clientX;
    const dy = e.touches[0].clientY - t0.clientY;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    panX = startPanX + dx; panY = startPanY + dy;
    clampPan(); applyPan();
  }
}, { passive: false });

shell.addEventListener('touchend', e => {
  if (e.touches.length === 1) {
    t0 = e.touches[0]; t1 = null; moved = false;
    startPanX = panX; startPanY = panY;
  } else {
    t0 = null; t1 = null;
  }
});

// Wheel input, modelled on Mapbox GL JS's scroll_zoom classifier. A physical
// wheel and a trackpad two-finger drag arrive as the same DOM event, so the
// device is inferred from delta shape. The verdict is STICKY for the duration of
// a gesture (re-deciding on every event is what made the mode flip-flop
// mid-scroll), and resets once the input goes idle.
const GESTURE_IDLE_MS = 400;
let wheelType   = null;       // 'wheel' | 'trackpad', null while undecided
let lastWheelAt = -Infinity;

function classifyWheel(e) {
  if (e.deltaMode !== 0) return 'wheel';      // line/page mode: only real wheels
  if (e.deltaX !== 0)    return 'trackpad';   // horizontal component
  // A wheel notch is coarse (100/120, or DPI-scaled); anything finer is a trackpad.
  // No Number.isInteger test; display scaling makes real wheels emit e.g. 133.33.
  return Math.abs(e.deltaY) < 50 ? 'trackpad' : 'wheel';
}

shell.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = shell.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  const now = performance.now();

  // A gap longer than GESTURE_IDLE_MS means the previous gesture ended.
  if (now - lastWheelAt > GESTURE_IDLE_MS) wheelType = null;
  lastWheelAt = now;

  // ctrlKey is a trackpad pinch: always zoom, and mark the gesture as trackpad so
  // a two-finger drag continuing after the pinch still pans.
  if (e.ctrlKey)        wheelType = 'trackpad';
  else if (!wheelType)  wheelType = classifyWheel(e);

  if (!e.ctrlKey && wheelType === 'trackpad') {
    // Two-finger drag → pan. A simultaneous pinch arrives as a separate ctrlKey
    // event, so pan and zoom interleave frame-to-frame.
    panX -= e.deltaX;
    panY -= e.deltaY;
  } else {
    // Trackpad pinch (ctrlKey) or physical mouse wheel → zoom around the cursor.
    const factor   = e.ctrlKey ? 1 - e.deltaY * 0.01 : (e.deltaY < 0 ? 1.1 : 1 / 1.1);
    const newScale = Math.max(fitScale(), Math.min(MAX_SCALE, scale * factor));
    const ratio    = newScale / scale;
    panX  = cx - ratio * (cx - panX);
    panY  = cy - ratio * (cy - panY);
    scale = newScale;
  }

  clampPan();
  applyPan();
}, { passive: false });

shell.addEventListener('mousemove', () => {
  document.getElementById('drag-hint').classList.add('hidden');
}, { once: true });


</script>
