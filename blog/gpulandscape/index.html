    #page { flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; }

    #controls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }

    #legend-series, #legend-mfr { display: flex; flex-wrap: wrap; gap: 2px 3px; flex: 1 1 auto; min-width: 0; }
    .legend-chip {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: .8rem; color: #eee; cursor: pointer; user-select: none;
      padding: 2px 4px; border-radius: 4px; transition: background .15s, opacity .15s;
    }
    .legend-chip:hover { background: #444; }
    .legend-chip.hidden-series, .legend-chip.hidden-mfr { opacity: .35; }
    .legend-marker { width: 16px; height: 16px; flex: 0 0 auto; }
    .legend-rate { color: #bbb; font-size: .75rem; }
    .legend-rate sup { font-size: .65rem; }
    .legend-swatch {
      width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto;
    }
    #legend-mfr .legend-chip { font-size: .78rem; padding: 3px 5px; }

    #api-filter-label { font-size: .78rem; color: #999; flex: 0 0 auto; }
    #api-filters { display: flex; flex-wrap: wrap; gap: 6px; }
    .api-chip {
      background: #555; color: #ccc; border: none; border-radius: 4px;
      padding: 3px 10px; font-size: .78rem; cursor: pointer; transition: background .15s, color .15s;
    }
    .api-chip:hover { background: #666; }
    .api-chip.active { background: #4a7ab8; color: #fff; font-weight: 600; }

    #count-info { flex: 0 0 auto; font-size: .78rem; color: #aaa; white-space: nowrap; }

    #chart-shell {
      flex: 1; position: relative; min-height: 0;
      background: #fcfcfa; overflow: hidden; cursor: grab; touch-action: none;
    }
    #chart-shell.dragging { cursor: grabbing; }
    #chart { display: block; width: 100%; height: 100%; }

    #tooltip {
      position: absolute; pointer-events: none;
      background: rgba(20,20,20,.92); color: #fff;
      padding: 8px 11px; border-radius: 6px; font-size: .78rem; line-height: 1.5;
      max-width: 260px; box-shadow: 0 2px 10px rgba(0,0,0,.3);
      transform: translate(-50%, -100%); margin-top: -10px;
      z-index: 10; transition: opacity .08s;
    }
    #tooltip.hidden { opacity: 0; visibility: hidden; }
    #tooltip .tt-name { font-weight: 700; margin-bottom: 2px; }
    #tooltip .tt-row { color: #ccc; }
    #tooltip .tt-row b { color: #fff; font-weight: 600; }
    #tooltip .tt-row.hovered b { color: #ffd54a; }

    @media (max-width: 720px) and (orientation: portrait) {
      #controls { padding: 8px 10px; gap: 8px; }
      .legend-chip { font-size: .75rem; padding: 3px 7px; }
      #count-info { display: none; }

function toSuperscript(n) { return String(n).split('').map(c => SUP_DIGITS[c] ?? c).join(''); }

const MS_PER_YEAR = 365.25 * 86400 * 1000;

// Each series is drawn on the SAME unitless log axis, in raw SI base units
// (FLOP/s, B/s, B) -- this only makes sense because compute/bandwidth/memory
// happen to occupy overlapping orders of magnitude for modern GPUs.
// Color encodes the value type; marker shape (below) encodes manufacturer.
// Each series is either a plain field (raw value * toBase) or a `derive`
// function computed from the full record (for ratios spanning two fields).
const SERIES = {
  compute:     { field: 'compute_gflops', toBase: v => v * 1e9, color: '#2e8b3d', label: 'Compute (FLOP/s)',       shortLabel: 'Compute',     unit: 'FLOP/s'   },
  bandwidth:   { field: 'bandwidth_gb_s', toBase: v => v * 1e9, color: '#2255cc', label: 'Bandwidth (B/s)',        shortLabel: 'Bandwidth',   unit: 'B/s'      },
  memory:      { field: 'memory_gb',      toBase: v => v * 1e9, color: '#cc3333', label: 'Memory (B)',             shortLabel: 'Memory',      unit: 'B'        },
  perfPerWatt: {
    derive: d => (d.compute_gflops && d.tdp_w) ? (d.compute_gflops * 1e9) / d.tdp_w : null,
    color: '#e08a00', label: 'Efficiency (FLOP/s per W)', shortLabel: 'Efficiency', unit: 'FLOP/s/W',
  },
  transistors: { field: 'transistor_count_m', toBase: v => v * 1e6, color: '#8b3fa0', label: 'Transistor Count', shortLabel: 'Transistors', unit: '' },
};
const SERIES_KEYS = Object.keys(SERIES);
const visible = {};
SERIES_KEYS.forEach(k => { visible[k] = true; });
visible.transistors = false; // busiest series visually; off by default, one click to add back

// Darkens a '#rrggbb' color by the given fraction, for trendlines: a bit
// richer/deeper than the series' own marker color so the line still reads
// as "this series" while standing apart from its own scatter of points.
function darkenColor(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 0xff) * (1 - amount));
  const g = Math.round(((n >> 8) & 0xff) * (1 - amount));
  const b = Math.round((n & 0xff) * (1 - amount));
  return `rgb(${r},${g},${b})`;
}

// Native bounding box for each logo path, used to scale/translate into a
// square bitmap regardless of the coordinate space the source SVG used.
// NVIDIA/AMD/Sony come pre-normalized to a 0,0-based box; AMD's isolated
// arrow and Intel's traced swirl needed their own (computed via SVG
// getBBox() against the source path, not hand-derived).
const LOGO_BBOX = {
  amd:   { x: 0,         y: 0,        w: 5.725,    h: 5.725    },
  intel: { x: -128.7332, y: 161.1824, w: 214.6159, h: 196.8376 },
};
function logoBBox(logoKey) { return LOGO_BBOX[logoKey] || { x: 0, y: 0, w: 24, h: 24 }; }

// Manufacturer -> logo key, for the brands with a compact identifiable mark.
const MFR_LOGO = { NVIDIA: 'nvidia', AMD: 'amd', Sony: 'sony', Intel: 'intel' };

// Marker shape encodes manufacturer, so color is free to encode value type.
const MFR_MARKERS = {
  NVIDIA: 'circle',
  AMD:    'square',
  Intel:  'swirl',
};

// Matrox/Sony/XGI are small, non-comparable outliers (niche business
// GPUs, one in-house console chip, a defunct spinoff -- 50 GPUs combined
// out of 2846) filtered out entirely rather than just hidden, to keep the
// legend focused on the three manufacturers with real historical depth.
const EXCLUDED_MFRS = new Set(['Matrox', 'Sony', 'XGI']);

// API-support filters: unlike the manufacturer/series toggles (which hide
// what's already shown), these are inclusion filters -- toggling one ON
// restricts the whole chart to GPUs whose record passes `test`. Multiple
// active filters combine with AND. Off (the default) applies no restriction.
const API_FILTERS = {
  dx12:   { label: 'DirectX 12+', test: d => d.directx_major >= 12 },
  vulkan: { label: 'Vulkan',      test: d => !!d.vulkan_major },
};
const activeApiFilters = new Set();
function passesApiFilters(d) {
  for (const key of activeApiFilters) {
    if (!API_FILTERS[key].test(d)) return false;
  }
  return true;
}

// Acquired brands are grouped under their acquirer for shape/legend/visibility
// purposes (ATI -> AMD in 2006, 3dfx's assets -> NVIDIA in 2000), but the
// tooltip still shows the GPU's actual original manufacturer -- this map is
// only consulted for the visual encoding, never for display text.
const MFR_GROUP = { ATI: 'AMD', '3dfx': 'NVIDIA' };
function mfrGroup(mfr) { return MFR_GROUP[mfr] || mfr; }

const hiddenMfrs = new Set();

let data = [];
let points = []; // flattened {d, series, value, t} across all three series

const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const shell = document.getElementById('chart-shell');
const tooltip = document.getElementById('tooltip');
const countInfo = document.getElementById('count-info');

// The whole canvas is the plot area -- no reserved strip for axis labels.
// Labels are drawn as overlays near the edges (with a background pill for
// legibility against the scatter behind them) instead of carving out margin
// space, so trendlines/points can use every available pixel.
const MARGIN = { top: 0, right: 0, bottom: 0, left: 0 };

// Draws an axis label with a small translucent background pill behind it,
// so it stays legible where it overlaps points/trendlines. Always uses
// textBaseline 'middle' -- `y` is the label's vertical center.
function drawAxisLabel(text, x, y, align) {
  const w = ctx.measureText(text).width;
  const padX = 4, h = 14;
  let bx = x - padX;
  if (align === 'right') bx = x - w - padX;
  else if (align === 'center') bx = x - w / 2 - padX;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(252,252,250,.82)';
  ctx.fillRect(bx, y - h / 2, w + padX * 2, h);
  ctx.fillStyle = '#777';
  ctx.fillText(text, x, y);
}
let plotW = 0, plotH = 0, dpr = 1;
let domainMinT = 0, domainMaxT = 0;
let logMin = 0, logMax = 0;
let scale = 1, panX = 0, panY = 0;
const MIN_SCALE = 1, MAX_SCALE = 40;

function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  const rect = shell.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  plotW = rect.width - MARGIN.left - MARGIN.right;
  plotH = rect.height - MARGIN.top - MARGIN.bottom;
  scale = MIN_SCALE; panX = 0;
  // Content is taller than the viewport now (Y_STRETCH), so center it
  // vertically by default instead of pinning to the top.
  panY = -(contentH() - plotH) / 2;
  clampPan();
  render();
}

function computeDomains() {
  const times = data.map(d => d._t);
  const span = Math.max(...times) - Math.min(...times);
  domainMinT = Math.min(...times) - span * 0.02;
  domainMaxT = Math.max(...times) + span * 0.02;

  const vals = points.map(p => p.value);
  logMin = Math.floor(Math.log10(Math.min(...vals)));
  logMax = Math.ceil(Math.log10(Math.max(...vals)));
}

// Least-squares fit of log10(value) vs. years-since-domainMinT (constant
// relative growth rate per year, i.e. a straight line in this chart's own
// log-value/linear-time axes).
function fitTrend(seriesPoints) {
  const n = seriesPoints.length;
  let sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (const p of seriesPoints) {
    const x = (p.t - domainMinT) / MS_PER_YEAR;
    const y = Math.log10(p.value);
    sx += x; sy += y; sxx += x * x; sxy += x * y;
  }
  const slope = (n * sxy - sx * sy) / (n * sxx - sx * sx);
  const intercept = (sy - slope * sx) / n;
  const tMin = Math.min(...seriesPoints.map(p => p.t));
  const tMax = Math.max(...seriesPoints.map(p => p.t));
  return { slope, intercept, growthFactor: Math.pow(10, slope), tMin, tMax };
}

function predictLog(trend, t) {
  const x = (t - domainMinT) / MS_PER_YEAR;
  return trend.slope * x + trend.intercept;
}

// Base (unzoomed, unpanned) plot-space coordinates, in pixels within the plot area.
function baseX(t) { return (t - domainMinT) / (domainMaxT - domainMinT) * plotW; }
// Y content is stretched taller than the visible plot area (independent of
// the interactive zoom scale) so the different series separate more clearly
// at the default view; panning vertically reveals the rest.
const Y_STRETCH = 1.6;
function contentH() { return plotH * Y_STRETCH; }
function baseYForLog(logV) { return contentH() - (logV - logMin) / (logMax - logMin) * contentH(); }

function screenX(bx) { return MARGIN.left + bx * scale + panX; }
function screenY(by) { return MARGIN.top + by * scale + panY; }

function clampPan() {
  const shellRect = shell.getBoundingClientRect();
  panX = Math.max(Math.min(0, shellRect.width - MARGIN.left - MARGIN.right - plotW * scale), Math.min(0, panX));
  panY = Math.max(Math.min(0, shellRect.height - MARGIN.top - MARGIN.bottom - contentH() * scale), Math.min(0, panY));
}

// Logos are complex bezier paths -- filling them ~7000 times per frame
// during pan/zoom would be slow, so each (logo, metric-color) combo is
// rasterized once to an offscreen canvas and blitted with drawImage instead.
const LOGO_BITMAP_SIZE = 32; // source resolution; drawn much smaller on screen
const logoBitmaps = {};

function buildLogoBitmaps() {
  for (const [logoKey, d] of Object.entries(LOGO_PATHS)) {
    const path = new Path2D(d);
    const box = logoBBox(logoKey);
    for (const seriesKey of SERIES_KEYS) {
      const c = document.createElement('canvas');
      c.width = c.height = LOGO_BITMAP_SIZE;
      const bctx = c.getContext('2d');
      bctx.scale(LOGO_BITMAP_SIZE / box.w, LOGO_BITMAP_SIZE / box.h);
      bctx.translate(-box.x, -box.y);
      bctx.fillStyle = SERIES[seriesKey].color;
      bctx.fill(path, 'evenodd');
      logoBitmaps[logoKey + '_' + seriesKey] = c;
    }
  }
}

function drawMarker(marker, sx, sy, color, sizeScale) {
  const r = 3.4 * sizeScale;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 1.3;
  switch (marker) {
    case 'cross':
      ctx.beginPath();
      ctx.moveTo(sx - r, sy); ctx.lineTo(sx + r, sy);
      ctx.moveTo(sx, sy - r); ctx.lineTo(sx, sy + r);
      ctx.stroke();
      break;
    case 'x':
      ctx.beginPath();
      ctx.moveTo(sx - r, sy - r); ctx.lineTo(sx + r, sy + r);
      ctx.moveTo(sx - r, sy + r); ctx.lineTo(sx + r, sy - r);
      ctx.stroke();
      break;
    case 'square':
      ctx.strokeRect(sx - r * 0.8, sy - r * 0.8, r * 1.6, r * 1.6);
      break;
    case 'triangle':
      ctx.beginPath();
      ctx.moveTo(sx, sy - r); ctx.lineTo(sx + r, sy + r * 0.8); ctx.lineTo(sx - r, sy + r * 0.8);
      ctx.closePath(); ctx.stroke();
      break;
    case 'triangle-down':
      ctx.beginPath();
      ctx.moveTo(sx, sy + r); ctx.lineTo(sx + r, sy - r * 0.8); ctx.lineTo(sx - r, sy - r * 0.8);
      ctx.closePath(); ctx.stroke();
      break;
    case 'diamond':
      ctx.beginPath();
      ctx.moveTo(sx, sy - r); ctx.lineTo(sx + r, sy); ctx.lineTo(sx, sy + r); ctx.lineTo(sx - r, sy);
      ctx.closePath(); ctx.stroke();
      break;
    case 'star': { // 6-point asterisk
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        const a = (Math.PI / 3) * i;
        ctx.moveTo(sx - r * Math.cos(a), sy - r * Math.sin(a));
        ctx.lineTo(sx + r * Math.cos(a), sy + r * Math.sin(a));
      }
      ctx.stroke();
      break;
    }
    case 'swirl': // original 3-petal pinwheel, evocative of the ~2000 "Intel
                  // Inside" swirl badge (not a trace of their trademarked art)
      for (let i = 0; i < 3; i++) {
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate((Math.PI * 2 / 3) * i);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(r * 0.95, -r * 0.1, r * 0.75, r * 0.6);
        ctx.quadraticCurveTo(r * 0.5, r * 0.9, 0, r * 0.35);
        ctx.quadraticCurveTo(r * 0.15, r * 0.1, 0, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      break;
    default: // circle (hollow)
      ctx.beginPath();
      ctx.arc(sx, sy, r * 0.85, 0, Math.PI * 2);
      ctx.stroke();
  }
}

function render() {
  const rect = shell.getBoundingClientRect();
  // Clear the *actual* backing store in device-pixel space first. Clearing
  // via CSS-pixel rect.width/height (queried fresh here) can drift a
  // fraction of a pixel from canvas.width/height (fixed, rounded, at the
  // last resize), leaving a stale sliver un-cleared at the edge every
  // frame -- invisible on one frame, but it compounds into visible ghosting
  // over the many rapid re-renders a zoom gesture triggers.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // ── Y gridlines (unitless decades, shared by all series) -- lines only;
  // labels are drawn afterward, on top of the points/trendlines, so they
  // stay legible instead of living in a separate reserved margin. ──
  ctx.strokeStyle = '#e9e9e6';
  const yLevels = [];
  for (let l = Math.floor(logMin); l <= Math.ceil(logMax); l++) {
    const sy = screenY(baseYForLog(l));
    if (sy < MARGIN.top - 20 || sy > MARGIN.top + plotH + 20) continue;
    ctx.beginPath();
    ctx.moveTo(MARGIN.left, sy);
    ctx.lineTo(MARGIN.left + plotW, sy);
    ctx.stroke();
    yLevels.push({ l, sy });
  }

  // ── X gridlines (years) -- step snapped to a "nice" round interval
  // (1/2/5/10/...) rather than raw division, so ticks land on clean years
  // and stay evenly, legibly spaced instead of crowding together. ──
  const minYear = new Date(domainMinT).getFullYear();
  const maxYear = new Date(domainMaxT).getFullYear();
  const yearSpanPx = screenX(baseX(Date.UTC(maxYear, 0, 1))) - screenX(baseX(Date.UTC(minYear, 0, 1)));
  const rawStep = (maxYear - minYear) / Math.max(yearSpanPx / 70, 1);
  const NICE_YEAR_STEPS = [1, 2, 5, 10, 20, 25, 50, 100];
  const yearStep = NICE_YEAR_STEPS.find(s => s >= rawStep) || NICE_YEAR_STEPS[NICE_YEAR_STEPS.length - 1];
  const yearTicks = [];
  for (let y = Math.ceil(minYear / yearStep) * yearStep; y <= maxYear + 1; y += yearStep) {
    const sx = screenX(baseX(Date.UTC(y, 0, 1)));
    if (sx < MARGIN.left - 30 || sx > MARGIN.left + plotW + 30) continue;
    ctx.strokeStyle = '#e9e9e6';
    ctx.beginPath();
    ctx.moveTo(sx, MARGIN.top);
    ctx.lineTo(sx, MARGIN.top + plotH);
    ctx.stroke();
    yearTicks.push({ y, sx });
  }

  // ── clip to plot area for points + trendlines ──
  ctx.save();
  ctx.beginPath();
  ctx.rect(MARGIN.left, MARGIN.top, plotW, plotH);
  ctx.clip();

  // ── points (shape/logo = manufacturer, color = value type) ──
  // Markers grow with zoom, but damped to the 0.25 power -- big enough to
  // stay legible when zoomed in without ballooning at max zoom.
  let shown = 0;
  ctx.globalAlpha = 0.65;
  const markerScale = Math.pow(scale, 0.25);
  const logoDisplaySize = 9 * markerScale;
  for (const p of points) {
    const group = mfrGroup(p.d.manufacturer);
    if (!visible[p.series] || hiddenMfrs.has(group) || !passesApiFilters(p.d)) continue;
    const sx = screenX(baseX(p.t));
    const sy = screenY(baseYForLog(Math.log10(p.value)));
    const logoKey = MFR_LOGO[group];
    if (logoKey) {
      const bmp = logoBitmaps[logoKey + '_' + p.series];
      ctx.drawImage(bmp, sx - logoDisplaySize / 2, sy - logoDisplaySize / 2, logoDisplaySize, logoDisplaySize);
    } else {
      drawMarker(MFR_MARKERS[group] || 'circle', sx, sy, SERIES[p.series].color, markerScale);
    }
    shown++;
  }
  ctx.globalAlpha = 1;

  // ── trendlines ──
  // Drawn a shade darker than the series' own marker color (rather than an
  // outline/halo) -- still reads as "this series" while standing apart from
  // its own scatter of points.
  for (const key of SERIES_KEYS) {
    if (!visible[key]) continue;
    const trend = SERIES[key].trend;
    if (!trend) continue;
    const x1 = screenX(baseX(domainMinT));
    const x2 = screenX(baseX(domainMaxT));
    const y1 = screenY(baseYForLog(predictLog(trend, domainMinT)));
    const y2 = screenY(baseYForLog(predictLog(trend, domainMaxT)));

    ctx.strokeStyle = SERIES[key].trendColor;
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // ── axis labels, drawn last so they sit on top of points/trendlines ──
  ctx.font = '11px system-ui, -apple-system, BlinkMacSystemFont, sans-serif';
  yLevels.forEach(({ l, sy }) => drawAxisLabel('10' + toSuperscript(l), MARGIN.left + 4, sy, 'left'));
  yearTicks.forEach(({ y, sx }) => drawAxisLabel(String(y), sx, MARGIN.top + plotH - 10, 'center'));

  countInfo.textContent = `${shown.toLocaleString()} data points shown (${data.length.toLocaleString()} GPUs)`;
}

function buildLegend() {
  const legend = document.getElementById('legend-series');
  legend.innerHTML = '';
  SERIES_KEYS.forEach(key => {
    const s = SERIES[key];
    const rate = s.trend ? s.trend.growthFactor.toFixed(2) : '?';
    const chip = document.createElement('div');
    chip.className = visible[key] ? 'legend-chip' : 'legend-chip hidden-series';
    chip.innerHTML =
      `<span class="legend-swatch" style="background:${s.color}"></span>` +
      `${s.label}` +
      `<span class="legend-rate">&times;${rate}<sup>year</sup></span>`;
    chip.addEventListener('click', () => {
      visible[key] = !visible[key];
      chip.classList.toggle('hidden-series', !visible[key]);
      render();
    });
    legend.appendChild(chip);
  });
}

function svgForMarker(marker, color) {
  const sw = 1.6;
  switch (marker) {
    case 'cross': return `<path d="M8 2 V14 M2 8 H14" stroke="${color}" stroke-width="${sw}"/>`;
    case 'x': return `<path d="M3 3 L13 13 M3 13 L13 3" stroke="${color}" stroke-width="${sw}"/>`;
    case 'square': return `<rect x="3" y="3" width="10" height="10" fill="none" stroke="${color}" stroke-width="${sw}"/>`;
    case 'triangle': return `<path d="M8 2 L14 13 H2 Z" fill="none" stroke="${color}" stroke-width="${sw}"/>`;
    case 'triangle-down': return `<path d="M8 14 L14 3 H2 Z" fill="none" stroke="${color}" stroke-width="${sw}"/>`;
    case 'diamond': return `<path d="M8 2 L14 8 L8 14 L2 8 Z" fill="none" stroke="${color}" stroke-width="${sw}"/>`;
    case 'star': return `<path d="M8 2 V14 M2.5 5 L13.5 11 M2.5 11 L13.5 5" stroke="${color}" stroke-width="${sw}"/>`;
    case 'swirl': {
      const petal = 'M0 0 Q5.7 -0.6 4.5 3.6 Q3 5.4 0 2.1 Q0.9 0.6 0 0 Z';
      return [0, 120, 240].map(deg =>
        `<path d="${petal}" fill="${color}" transform="translate(8,8) rotate(${deg})"/>`
      ).join('');
    }
    default: return `<circle cx="8" cy="8" r="5" fill="none" stroke="${color}" stroke-width="${sw}"/>`;
  }
}

function buildMfrLegend() {
  const legend = document.getElementById('legend-mfr');
  legend.innerHTML = '';
  const counts = {};
  data.forEach(d => { const g = mfrGroup(d.manufacturer); counts[g] = (counts[g] || 0) + 1; });
  Object.keys(MFR_MARKERS)
    .filter(m => counts[m])
    .sort((a, b) => counts[b] - counts[a])
    .forEach(m => {
      const chip = document.createElement('div');
      chip.className = 'legend-chip';
      const logoKey = MFR_LOGO[m];
      const box = logoBBox(logoKey);
      const glyph = logoKey
        ? `<svg class="legend-marker" viewBox="${box.x} ${box.y} ${box.w} ${box.h}"><path d="${LOGO_PATHS[logoKey]}" fill="#ddd" fill-rule="evenodd"/></svg>`
        : `<svg class="legend-marker" viewBox="0 0 16 16">${svgForMarker(MFR_MARKERS[m], '#ddd')}</svg>`;
      chip.innerHTML = glyph + `${m} (${counts[m]})`;
      chip.addEventListener('click', () => {
        if (hiddenMfrs.has(m)) hiddenMfrs.delete(m); else hiddenMfrs.add(m);
        chip.classList.toggle('hidden-mfr', hiddenMfrs.has(m));
        render();
      });
      legend.appendChild(chip);
    });
}

function buildApiFilters() {
  const container = document.getElementById('api-filters');
  container.innerHTML = '';
  Object.entries(API_FILTERS).forEach(([key, f]) => {
    const chip = document.createElement('button');
    chip.className = 'api-chip';
    chip.textContent = f.label;
    chip.addEventListener('click', () => {
      if (activeApiFilters.has(key)) activeApiFilters.delete(key); else activeApiFilters.add(key);
      chip.classList.toggle('active', activeApiFilters.has(key));
      render();
    });
    container.appendChild(chip);
  });
}

// ── tooltip / nearest-point hit test ──
function findNearest(mx, my) {
  let best = null, bestD = 12 * 12; // px^2 threshold
  for (const p of points) {
    if (!visible[p.series] || hiddenMfrs.has(mfrGroup(p.d.manufacturer)) || !passesApiFilters(p.d)) continue;
    const sx = screenX(baseX(p.t));
    const sy = screenY(baseYForLog(Math.log10(p.value)));
    const dx = sx - mx, dy = sy - my;
    const dist2 = dx * dx + dy * dy;
    if (dist2 < bestD) { bestD = dist2; best = { p, sx, sy }; }
  }
  return best;
}

function formatBase(value, unit) {
  const prefixes = [[1e12, 'T'], [1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, '']];
  for (const [mag, prefix] of prefixes) {
    if (value >= mag) return (value / mag).toPrecision(3).replace(/\.?0+$/, '') + ' ' + prefix + unit;
  }
  return value.toPrecision(2) + ' ' + unit;
}

function showTooltip(hit) {
  const d = hit.p.d;
  const rows = SERIES_KEYS.map(key => {
    const s = SERIES[key];
    const value = s.derive ? s.derive(d) : (d[s.field] > 0 ? s.toBase(d[s.field]) : null);
    const cls = key === hit.p.series ? 'tt-row hovered' : 'tt-row';
    return `<div class="${cls}">${s.shortLabel}: <b>${value ? formatBase(value, s.unit) : 'n/a'}</b></div>`;
  }).join('');
  tooltip.innerHTML = `
    <div class="tt-name">${d.manufacturer} ${d.name}</div>
    <div class="tt-row">${d.release_date}${d.architecture ? ' &middot; ' + d.architecture : ''}</div>
    ${rows}
  `;
  tooltip.style.left = hit.sx + 'px';
  tooltip.style.top = hit.sy + 'px';
  tooltip.classList.remove('hidden');
}

// ── pan/zoom (mouse drag, wheel, touch) ──
let dragging = false, moved = false;
let startX = 0, startY = 0, startPanX = 0, startPanY = 0;

shell.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  dragging = true; moved = false;
  startX = e.clientX; startY = e.clientY;
  startPanX = panX; startPanY = panY;
  shell.classList.add('dragging');
  // Overrides the inline 'pointer' cursor a hover may have set just before
  // the drag started -- inline style otherwise outranks the .dragging CSS
  // rule and would stick on 'pointer' through the whole drag.
  shell.style.cursor = 'grabbing';
});

window.addEventListener('mousemove', e => {
  if (dragging) {
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    panX = startPanX + dx; panY = startPanY + dy;
    clampPan(); render();
    tooltip.classList.add('hidden');
    return;
  }
  const rect = shell.getBoundingClientRect();
  if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) {
    tooltip.classList.add('hidden'); return;
  }
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const hit = findNearest(mx, my);
  if (hit) showTooltip(hit);
  else tooltip.classList.add('hidden');
  shell.style.cursor = hit ? 'pointer' : 'grab';
});

// Click a marker to open its TechPowerUp page. Guarded by `moved` (set in
// the mousemove drag handler above) so releasing a pan/zoom drag over a
// point doesn't accidentally navigate away.
shell.addEventListener('click', e => {
  if (moved) return;
  const rect = shell.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const hit = findNearest(mx, my);
  if (hit && hit.p.d.tpu_url) window.open(hit.p.d.tpu_url, '_blank', 'noopener');
});

window.addEventListener('mouseup', () => {
  dragging = false;
  shell.classList.remove('dragging');
  shell.style.cursor = '';
});

// Trackpad-vs-wheel classifier (same heuristic as blog/gpudynamicwork): a
// physical wheel and a two-finger trackpad drag both arrive as 'wheel'
// events, so the device is inferred from delta shape, sticky per gesture.
const GESTURE_IDLE_MS = 400;
let wheelType = null, lastWheelAt = -Infinity;

function classifyWheel(e) {
  if (e.deltaMode !== 0) return 'wheel';
  if (e.deltaX !== 0) return 'trackpad';
  return Math.abs(e.deltaY) < 50 ? 'trackpad' : 'wheel';
}

shell.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = shell.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  const now = performance.now();
  if (now - lastWheelAt > GESTURE_IDLE_MS) wheelType = null;
  lastWheelAt = now;

  if (e.ctrlKey) wheelType = 'trackpad';
  else if (!wheelType) wheelType = classifyWheel(e);

  if (!e.ctrlKey && wheelType === 'trackpad') {
    panX -= e.deltaX;
    panY -= e.deltaY;
  } else {
    const factor = e.ctrlKey ? 1 - e.deltaY * 0.01 : (e.deltaY < 0 ? 1.15 : 1 / 1.15);
    const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * factor));
    const ratio = newScale / scale;
    panX = cx - ratio * (cx - panX);
    panY = cy - ratio * (cy - panY);
    scale = newScale;
  }
  clampPan();
  render();
  tooltip.classList.add('hidden');
}, { passive: false });

// Touch: single-finger pan + two-finger pinch-zoom.
let t0 = null, t1 = null, startScale = 1, pinchMidX = 0, pinchMidY = 0;
let touchMoved = false;
function touchDist(a, b) {
  const dx = a.clientX - b.clientX, dy = a.clientY - b.clientY;
  return Math.sqrt(dx * dx + dy * dy);
}
shell.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    t0 = e.touches[0]; t1 = null;
    touchMoved = false;
    startPanX = panX; startPanY = panY;
  } else if (e.touches.length === 2) {
    t0 = e.touches[0]; t1 = e.touches[1];
    startScale = scale; startPanX = panX; startPanY = panY;
    const rect = shell.getBoundingClientRect();
    pinchMidX = (t0.clientX + t1.clientX) / 2 - rect.left;
    pinchMidY = (t0.clientY + t1.clientY) / 2 - rect.top;
  }
  e.preventDefault();
}, { passive: false });

shell.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 2 && t1) {
    const a = e.touches[0], b = e.touches[1];
    const dist0 = touchDist(t0, t1), dist1 = touchDist(a, b);
    const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, startScale * dist1 / dist0));
    const ratio = newScale / startScale;
    const rect = shell.getBoundingClientRect();
    const curMidX = (a.clientX + b.clientX) / 2 - rect.left;
    const curMidY = (a.clientY + b.clientY) / 2 - rect.top;
    panX = curMidX - ratio * (pinchMidX - startPanX);
    panY = curMidY - ratio * (pinchMidY - startPanY);
    scale = newScale;
    clampPan(); render();
  } else if (e.touches.length === 1 && t0 && !t1) {
    const dx = e.touches[0].clientX - t0.clientX;
    const dy = e.touches[0].clientY - t0.clientY;
    if (Math.abs(dx) + Math.abs(dy) > 6) touchMoved = true;
    panX = startPanX + dx; panY = startPanY + dy;
    clampPan(); render();
  }
}, { passive: false });

// A tap is handled explicitly here rather than relying on the browser's
// synthesized 'click' event: touchstart/touchmove call preventDefault()
// above (required so a pinch/pan gesture doesn't also scroll the page),
// which as a side effect suppresses that synthesized click entirely -- so
// without this, taps on touch devices would never open anything.
shell.addEventListener('touchend', e => {
  if (!touchMoved && !t1 && e.changedTouches.length === 1) {
    const rect = shell.getBoundingClientRect();
    const touch = e.changedTouches[0];
    const mx = touch.clientX - rect.left, my = touch.clientY - rect.top;
    const hit = findNearest(mx, my);
    if (hit && hit.p.d.tpu_url) window.open(hit.p.d.tpu_url, '_blank', 'noopener');
  }
  if (e.touches.length === 1) { t0 = e.touches[0]; t1 = null; startPanX = panX; startPanY = panY; }
  else { t0 = null; t1 = null; }
});

window.addEventListener('resize', resizeCanvas);

// ── load & init ──
fetch('gpu_data.json')
  .then(r => r.json())
  .then(json => {
    data = json.filter(d => !EXCLUDED_MFRS.has(d.manufacturer));
    data.forEach(d => { d._t = Date.parse(d.release_date); });

    points = [];
    data.forEach(d => {
      SERIES_KEYS.forEach(key => {
        const s = SERIES[key];
        const value = s.derive ? s.derive(d) : (d[s.field] > 0 ? s.toBase(d[s.field]) : null);
        if (value && value > 0) points.push({ d, series: key, value, t: d._t });
      });
    });

    // Points with the identical (series, date, value) sit exactly on top of
    // each other (e.g. two SKUs that share a die and launch day but differ
    // only in memory size). Nudge them apart in time by a few days each --
    // invisible at the default zoomed-out view, but far enough apart in
    // pixels once zoomed in that they no longer occlude one another.
    const JITTER_STEP_MS = 3 * 86400 * 1000;
    const dupGroups = new Map();
    points.forEach(p => {
      const key = p.series + '|' + p.t + '|' + p.value;
      if (!dupGroups.has(key)) dupGroups.set(key, []);
      dupGroups.get(key).push(p);
    });
    dupGroups.forEach(group => {
      if (group.length <= 1) return;
      group.forEach((p, i) => {
        p.t += (i - (group.length - 1) / 2) * JITTER_STEP_MS;
      });
    });

    computeDomains();
    SERIES_KEYS.forEach(key => {
      SERIES[key].trend = fitTrend(points.filter(p => p.series === key));
    });

    buildLogoBitmaps();
    buildLegend();
    buildMfrLegend();
    buildApiFilters();
    resizeCanvas();
  })
  .catch(err => {
    ctx.fillStyle = '#c00';
    ctx.font = '14px system-ui, -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillText('Failed to load gpu_data.json: ' + err, 20, 30);
  });
</script>
<script src="/blog/posts.js"></script>
<script src="/blog/sidebar.js"></script>
</body>
</html>
