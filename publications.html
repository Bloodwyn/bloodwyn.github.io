          { label: "Comments for the Authors", value: `# Paper summary
The authors propose a GPU-friendly method for image alignment though refinement of sparse correspondences. To this goal they establish sparse correspondence pairs using an existing method and then minimize per-pixel cross-correlation between the two images following a mesh-based interpolation. Specifically, they optimize the mesh vertices using an evolutionary algorithm. The authors calibrate hyper-parameters of their method and demonstrate improvement of per-pixel cross-correlation for 4 different correspondence matchers.

# Recommendation
The paper has a clear motivation, it is well written and the results confirm that the method indeed improves cross-correlation. However, I am not convinced this is relevant in presence of powerful end-to-end image matching methods that are competitive in terms of both speed and accuracy. Critically, the authors do not compare to any such existing methods. Moreover, they do not evaluate the accuracy of their matching using any metric other than ECC which is problematic because this is simultaneously the optimization objective. Therefore, the fact that the metric value goes down during the optimization is trivial. Finally, I have concerns about novelty given the common use of cross-correlation for stereo matching and the similarity between the evolutionary algorithm here and the stochastic optimization in PatchMatch. As such, I cannot recommend accepting the paper. The authors are encouraged to show that the optimization is also improving other image metrics and that the chosen optimization method is more effective than common stereo-matching techniques in their future revision.

======== Detailed Comments ==============

# Strengths

+ The exposition is clear and I have not observed any typos.
+ The experiments are described with enough details for reproducibility.
+ The experiments include multiple datasets and baseline feature matchers.

# Weaknesses

- The evaluation relies solely on ECC. However, ECC is also the optimization objectives so it must go down by definition. It is not clear if this also improves other metrics (PSNR, SSIM, LPIPS,...).

- The method is not compared to any recent end-to-end image matching algorithms. These algorithms typically have a sub-second runtime so it cannot be argued that the computational efficiency is a constraint. Examples:

          { label: "Summary", value: `This paper introduces two important improvements for computing breadth-first Catmull-Clark subdivision on quad-only meshes in parallel. The first improvement is a novel data-structure called "edge-friend" to represent the topology of the mesh at each subdivision step. The main benefit of edge-friend is that it requires less memory than state-of-the-art data-structures. In practice, this reduced memory consumption reduces the bandwidth of breadth-first subdivision and the authors show that they can speed-up computations by a factor of three. A potential downside of the approach is that it requires to introduce ghost faces, vertices and edges. In practice however, the authors show that this wasted computation still leads to better performances than waste-free methods and describe an efficient mesh-shader based implementation for rendering the resulting geometry. The second contribution is a better locality for the vertex points produced by the subdivision. This is accomplished by systematically interleaving vertex, face and edge points rather than concatenating them as is done in previous work. This paper is perfectly suited for HPG in my opinion. And I also really liked the vectorial teaser :)` },

        [
          { label: "Summary", value: `The authors present a compression scheme for per-vertex blending information. Each vertex requires a set of blend weights and bone indices. Blend weights are in the range [0, 1] and sum to one. The paper stipulates that blend weights always occur in ascending order. This order can be recovered through sorting. With this, the order in which weights are stored physically encodes a permutation index. By choosing this index, one can use the corresponding permutation to store additional data.

Similar to previous work, the proposed scheme uses a table of unique bone index tuples. Sorting weights instead of bone indices makes this table larger than some other methods; the paper proposes to reduce the size of this table again by determining "irrelevant" indices when determining the unique tuples. With the table, each vertex needs to store a set of weights and a single index, identifying a unique bone index tuple entry.

          { label: "Reproducibility", value: "Method seems reproducible. Authors have provided code that compiles and runs." },
          { label: "Overall evaluation", value: "SCORE: 3 (strong accept)" },
          { label: "Explanation of Recommendation", value: `The paper focuses on compressing blend weights and presents a method that does exactly this. The method provides a better compression (in terms of compression rate vs. error) than competing methods. Performance is comparable to other methods, only starting to lose out slightly at higher bone counts. It nevertheless outperforms a naive implementation due to reduced memory bandwidth. Trading lower memory bandwidth for a slight increase in compute is typically worthwhile, which is in favour of the proposed method.

While it's difficult to see the method being applied as-is to other data (on account on relying on properties that seem very specific to blend weights), the paper brings several novel and fresh ideas to the table. These are interesting in their own right.

I would suggesting giving more context early on (e.g. in the Introduction). For example, mentioning the overall vertex layout (Section 4.3; total of 128 bits) will likely help a broader audience understand that compressing blend weights in the proposed manner has a significant impact and give some insight into the relative cost of using 32 or 64 bits (and additionally underscore that naively storing the weights is indeed much much more expensive).` },
        ],
        [
          { label: "Summary", value: `This work describes a novel technique for efficient representation of attributes for skinned animation (blend weights and bone indices) that can compactly encode information about a large number of bones in fixed per vertex storage. The paper integrates interesting ideas in the areas of data encoding and compression and includes a fairly rigorous analysis on the approaches used in the context of applying them to coding of skinning attributes.

The encoding technique is based on two key insights presented in the paper: the ordering of a set of weights per vertex can be chosen arbitrarily, and thus a particular choice of that ordering can carry information to the decoder; weights can be transformed linearly prior to quantization, which increases their effective range and allows the quantization to be carried out independently for each weight, minimizing the overall error. Additionally, authors precompute the set of unique bone index tuples offline, which results in having to store only a single index into the table per vertex.

The main contribution of the approach is that it allows to lift the often used restriction on the maximum number of bones that can affect any single vertex in an animation system. It is typical for the state of the art real-time rendering systems to limit that number to a fairly low value (e.g. 4), out of performance and memory footprint concerns, which limits artistic freedom and the content creation pipeline. The system described in the paper can practically support up to 13 bones per vertex encoding all relevant attributes in as little as 64 bits, enabling higher-quality real-time skinning animation.` },
          { label: "Clarity of Exposition", value: `The general structure of the paper is solid, the problem statement and the key ideas are presented clearly with progressively increasing level of detail. The section on permutation coding and the use of Lehmer codes could benefit from a better explanation, though. In particular, the construction of Lehmer codes is probably better described as a sequential process of assigning indices to elements still remaining in the list and then representing the result as a single number in factorial base. A couple of concrete examples would help the clarity here. The mention of concatenating sequence indices with weights while sorting and the reference to register spilling can be confusing to some readers. Similarly, the section on blend weight transformation could probably use some diagrams to build a better geometric intuition of the transform.

The choice of the illustration on the front page is somewhat questionable and feels arbitrary - while the depicted transform is one of the key contributions of the paper, it feels a bit out of place as a title illustration.` },
          { label: "Technical Soundness", value: `The method is technically sound and authors provide rigorous analysis of the presented techniques, including rounding error propagation through the transforms, quantization of weights, and bit allocations for various possible configurations of the system (number of supported bones and the bit budget). Some of the parameters are determined through exhaustive search.

The method used for evaluation of performance benefit of the presented technique uses a full rendering application that implements skinned animation on a geometrically complex scene and a micro-benchmark that targets evaluating the cost of the encoding and decoding as a separate process. While the authors provide comparisons against using uncompressed weights in the rendering application (simply storing the weights as arrays of floats), no such comparison is done in the micro-benchmark. I think it will be informative to include a comparison between the naive approach of fetching uncompressed data from memory vs saving that extra bandwidth and instead relying on reconstructing the weights in the GPU kernel.` },
          { label: "Quality of References", value: "The list of references seems fairly comprehensive and adequate. It is nice to see a reference to a paper from 1826 at the top of the list." },
          { label: "Reproducibility", value: "The information provided in the paper is sufficient for anyone skilled in the art to build the described system. Authors also provide complete implementations of the encoder and the decoder in the form of python and GLSL code as supplemental material." },
          { label: "Overall evaluation", value: "SCORE: 2 (accept)" },
          { label: "Explanation of Recommendation", value: `I think this submission provides a good example of how a few simple ideas can be integrated in a synergetic way to build a practical system that tries to accommodate some of the constraints of popular rendering architectures (limited number of per-vertex attributes, memory bandwidth bottlenecks).  The rigor demonstrated by the authors in the construction of the algorithms, the reasoning behind and the analysis of the various design choices is definitely one of the strengths of the paper. The problem authors address is practically relevant, and it is nice to see algorithmic improvements in important applications (skinned animation in this case) being tailored towards the trajectory of the rendering hardware, rather than simply expecting extensive improvements in raw horsepower to become practical.

At the same time,  I have some concerns around the scale of the impact this technique can make, compared to the state of the art. While permuting a large number of weights does allow to encode an interesting number of extra bits of information, it is less clear that the complexity of the reconstruction approach is worth it when the number of bones is low (like 4 or 8). Performance advantages of the proposed compression scheme are also not as obvious in that case, especially considering that in the naive approach the blend weights can simply use more compact data types, like 16-bit floats, which would cut the bandwidth requirements in half.

It would also be good to include at least some discussion around the benefits of using a very large number of weights per vertex (which is the regime where the system really shines). What are the situations that require 13 bones affecting a single vertex? It's probably more relevant to compare the resulting animation quality between using all 13 bones vs picking e.g. top 4, as compared to the discussion on the error analysis due to quantization and compression (which is great from the technical perspective!).

It may also be possible that simple tweaks to the naive implementation (e.g. fetching the weights from memory vs passing them down as per-vertex attributes) can have substantial impact on the baseline performance. The compute micro-benchmark can help isolate that tradeoff somewhat better, as I mentioned above.` },
        ],
        [
          { label: "Summary", value: `The paper addresses the problem of compressing attributes for vertex blending (skinning). With character rigs becoming ever more complicated and the number of triangles for skinned meshes ever increasing, this is an important problem that seems to have seen surprisingly little attention in previous work. In fact the authors claim only one previous work to exist that directly deals with the problem (I am not able to confirm or deny that statement, but googling quickly did not show me any other work that needs comparing to).

My understanding of the suggested method is as follows:
Sort the weights w0...wn (bone indices are stored in this order). Since the largest weight need not be stored, the weight vector is now within the tetrahedron in Fig 1a. Transform the weights (shear the tetrahedron) so that the weights instead lie within the sixth of the unit cube as in Fig 1b. Each axis of this unit cube is assigned a specific precision and thus one specific permutation of the weights will have the smallest error. I think the permutation is found by assigning more bits to the consecutive weights with the largest distance (this is the Lehmer code stuff in algorithms 1 and 2) which boils down to O(n) where n is the number of weights. Since the weights were originally sorted, any permutation can be undone and each vertex can get its correct weight. The weights are quantized as aB + b where B has a certain number of bits for each axis (its precision) and b is a constant-bit small number that interpolates between these divisions. Additionally, as in previous work
, the authors make use of the fact that many vertices will share the set of bone indices, and so, for each vertex, they need only store a tuple index and the b values.

The evluation shows the method performing well w.r.t. error in most cases, when compared to previous work and at competetive framerates.` },
          { label: "Clarity of Exposition", value: `The language is very good, and I have no problems with the text as such. The introduction and previous work sections also motivate the paper well. However, I must admit I found the method extremely hard to understand. I do not think there is anything wrong with the existing text, but, in my opinion, it suffers badly from not having an easily understandable overview of the algorithm. It starts by describing how permutations are performed and stored compactly for two pages before we get any hint as to _why_ the permutations are necessary. In the introductory problem statement the actual compression scheme is completely avoided. Sentences like: "We encode the tuple index and 'a few other quantities'" in 3.1 and "Based on 'another attribute', we pick one..." in the Figure 1 caption, are probably meant to hide complexity but also fail to convey the method clearly.` },
          { label: "Technical Soundness", value: "I believe the paper to be technically sound. The only thing I found a bit surprising was that the test scene consists of 28 characters merged into a single model with 1412 bones. I do not understand the rationale behind this." },
          { label: "Quality of References", value: "The previous work section looks good to me." },
          { label: "Reproducibility", value: `I strongly believe that the results _can_ be reproduced from the information in the paper. And there is a lot of error analysis and other goodies (including source code) that should be applauded. As previously stated, it would not be an easy task however, because all of the details make it very hard to see the "whole picture".` },
          { label: "Overall evaluation", value: "SCORE: 2 (accept)" },
          { label: "Explanation of Recommendation", value: "With my current understanding of the method, I believe it to be a very good candidate for weight compression, and the approach was new to me and very interesting. I would still urge the authors to _please_ attempt to start with an easy to understand early overview of the algorithm, before diving in to details." },
        ],

    "vbac": {
      presentation: "https://www.youtube.com/embed/L8IfdFokzDA?start=3925",
      demo: "https://www.youtube.com/embed/CqiYm94Wz08",
      code: {
        url:  "https://raw.githubusercontent.com/Bloodwyn/Vertex-Blend-Attribute-Compression/master/src/32OSS_ITS.fnc.glsl",
        lang: "glsl",
        repo: "https://github.com/Bloodwyn/Vertex-Blend-Attribute-Compression",
      },
      reviews: [
        [
          { label: "Overall Recommendation", value: "4 (Borderline accept)" },
          { label: "Evaluation Confidence", value: "3 (3 - Moderately confident, I know as much as most)" },
          { label: "Summary", value: "This paper describes a set of techniques for encoding bone indices and weights for skinned meshes. These methods reduces the storage bits by up to 50% without introducing visible errors." },
          { label: "Clarity of Exposition", value: "The exposition is clear." },
          { label: "Technical Soundness", value: "I am convinced that the techniques presented in the paper will work." },
          { label: "Quality of References", value: "References seems adequate to me." },
          { label: "Reproducibility", value: "The results should be repreducible, since the algorithms and experiment set-ups has been described clearly, and key source code is also provided." },
          { label: "Explanation of Recommendation", value: `This paper introduces an interesting algorithm to compress skin transform data and it is clear that it should work well in most cases. My major concern is to what extent is this algorithm useful in practice. In the best scenario presented by this paper, we are achieving a 2-byte reduction in storage per vertex. Given that a typical vertex representation ranges needs 20 bytes already to represent position, normal and tangent vectors with sufficient precision, the algorithm is achieving less than 10% overall compression rate in terms of raw bits. If you want to align vertices to 4-byte boundary, the reductions in bits may not turn into any reduction of overall memory footprint.

The paper only measures results in 4-bone-per-vertex meshes. Latest game engines typically support more than 8 bones per vertex. I am curious how well the methods will perform for 8-bone meshes, particularly for the bone-index compression part of the story, since there will be significantly more unique tuple combinations that reduces the effectiveness of the technique.

For these reasons I think the additional processing step and run-time overhead introduced by the technique may not worth its benefits in practice, although the algorithm itself is an interesting one.` },
        ],
        [
          { label: "Overall Recommendation", value: "4 (Borderline accept)" },
          { label: "Evaluation Confidence", value: "3 (3 - Moderately confident, I know as much as most)" },
          { label: "Summary", value: "This paper proposes to compress vertex-blend attributes to reduce memory traffic and, in turn, speed up rendering.\nThe authors propose a variant of lossless dictionary-based compression for handling bone indices, and a tailored lossy quantization scheme for vertex weights." },
          { label: "Clarity of Exposition", value: `I only have a shallow knowledge of animation systems, so take the following as the point of view of someone external to the field that is looking for insight and understanding.

I would have appreciated some discussion on how the budget of vertex-blend attributes is commonly handled in current productions. Is 4 weights per vertex the norm, or is this restricted to key characters? Is it possible to use a variable number of weights per vertex (given that this would require additional bookkeeping)? In general, having more information of the context would have helped me better understand the motivation for the proposed compression scheme. For instance, what is the cost of animating characters in the frame budget for various typical scenarios (e.g. open-world game with a city environment)? Having read this paper, it is not clear to me what benefit could be expected in a practical scenario.

My main gripe with the text is its liberal use of acronyms, including in section titles like "POT AABB (POT)". Acronyms often hinder understanding and I fear this may be the case in this paper. Sentences like "Fig. 3b shows that Any AABB reduces the number of invalid tuples over POT AABB." are uselessly cryptic. As far as I can tell, the key difference between "Any AABB" and "POT AABB" is that the formed offers a tight bounding box fit, and the improvement (less invalid tuples in this case) directly derives from this tighter fit. The naming convention ("POT AABB" and "Any AABB") does not help convey that information.

Overall, the naming convention could benefit from focusing on conceptual differences, instead of technical ones. For instance, it is not clear how relevant the "power of two" notion is in the "POT AABB" scheme. The text mentions that the number of samples on each axis is a power of two, but not why. It took me a couple passes through the text to realize that the issue was that weights had to be encoded into "B" bits and that each bit would correspond to a single sampling grid point. In this context, "invalid tuples" are effectively wasted bits. It seems to me that this is an important high-level point to highlight, which the text appears to consider evident. Still, the focus on "POT AABB" versus "Any AABB" is maybe less insightful than "isotropic grid" versus "anisotropic grid", or "regular bounding box" versus "tight bounding box".

Regarding the difference between "POT AABB" and "Any AABB", the observation that "Any AABB reduces the number of invalid tuples" is vague. The text could explicitly state the exact ratio of invalid tuples in both cases, and relate this to the quality evaluation in Figure 6.

I would swap section 4.2 and 4.1. The fact that vertex weights are non-negative and sum up to 1 (which is mentioned in Section 4.2) is the basis of the "unit cube sampling" scheme described in Section 4.1.

The text sometimes states things as matter of fact when the relation is not clear. For instance, in the sentence "To reduce invalid tuples, we sample each axis with a non-POT sample count and try to make the total sample count a POT", why would having the number of samples on each axis be a power of two or not have an impact on the ratio of invalid tuples?

Section 4.5 and Figure 4, i.e. everything about simplex chopping, could be moved to the supplemental material since it is not used in practice.

Initially, "i" is used as an index in the vertex weight array (Section 4.2, 4.3 and 4.4), but in Section 5 "i" represents the first axis of the weight space.` },
          { label: "Technical Soundness", value: "The proposed compression scheme is sound." },
          { label: "Quality of References", value: "The bone index compression scheme is reminiscent of standard dictionary-based schemes, and it would be appropriate to relate it to classical approaches (e.g. the LZW algorithm)." },
          { label: "Reproducibility", value: "Yes, the work could be reproduced. The fact that the author implementation is provided is also very nice." },
          { label: "Explanation of Recommendation", value: `Improving performance by reducing memory traffic through asset compression is an interesting topic, and this paper makes for an interesting read in this context.

The approach taken for compressing data (dictionary-base for bone indices, and quantization for weights) is straightforward, but effective in practice.

The main reason for my moderate grade is that I find it difficult to assess the practical impact of the proposed compression scheme. The example of Figure 1 contains only animated meshes and trivial shading. The improvement in this context is significant, but it is unclear how representative it is of real-world scenarios. Also, I would have liked to see how the proposed compression scheme compares to simply using fewer weights per vertex. Taking Figure 1 as an example, how would performance change when using 1 weight for models in the back, 2 weights for models in the middle, and 4 weights for models in the front (or any other naive level-of-detail strategy).` },
        ],
        [
          { label: "Overall Recommendation", value: "5 (Accept)" },
          { label: "Evaluation Confidence", value: "3 (3 - Moderately confident, I know as much as most)" },
          { label: "Summary", value: `The paper presents a specialized compression for skinning data. The compression consists of two parts: index and weight compression. The index compression is a simple deduplication of ordered bone index sets, adding an indirection index. The weight compression is based on the space formed by convex weights and its uniform sampling.

Unfortunately, the method is limited to four weights. Presumably, this limit appears to be caused by the unavailability of closed form solutions for higher dimensions and the impracticality of an iterative method for higher dimensions, though this is not explicitly stated.` },
          { label: "Clarity of Exposition", value: "The paper is well written and very polished already. The figures are clear and aid understanding the concepts. Minor improvements can me made such as moving the observation that w_i < i^-1 further to the front or mentioning it in the figure caption(s) to clear up the coordinates in Figures 2 and 3." },
          { label: "Technical Soundness", value: `Yes.

> First, samples inside the simplex are distributed uniformly, since, in general, we must assume that all weights are equally likely.

I would be curious to see if this is actually the case. It should be easy to support this with some evidence, such as a histogram of the distribution in the used sample models. A non-uniform sampling pattern would hint that additional compression could be gained with a corresponding entropy encoding.` },
          { label: "Quality of References", value: `Yes, from what I can tell.

Since vertex blending is certainly not the only application of convex weights, there might a similar method of compression applied in a different field already out there, but that's likely hard to find. On the other hand, due to the practical limitation to four weights, this method unfortunately may not generalize to other application areas though.` },
          { label: "Reproducibility", value: "Yes. I especially like that source code is already provided for the review as supplementary material." },
          { label: "Explanation of Recommendation", value: "Overall this is a well written paper with a novel method to compress vertex blending attributes. The problem however is exists in somewhat of a niche so the practicality and impact of the approach is limited. In typical application scenarios, animated meshes constitute a minority of the scene content and thus the overall impact of compressing vertex blending attributes on memory consumption and performance is likely negligible. Nevertheless, in research not every solution must have a major practical impact to be a valuable contribution to the scientific discourse. Therefore, I recommend acceptance of the paper." },
        ],
        [
          { label: "Overall Recommendation", value: "5 (Accept)" },
          { label: "Evaluation Confidence", value: "5 (5 - Extremely confident, I consider myself an expert)" },
          { label: "Summary", value: "This paper presents a compression of linear blend skinning vertex data that produces results indistinguishable from the original skinning data. Due to the bandwidth reduction from the compressed data, their method was also faster on all of their sample data. The compression is a combination of recognizing that limited sets of transforms ever appear together, so can be compactly stored by an index into a table, and that the space of weights could be more efficiently encoded." },
          { label: "Clarity of Exposition", value: `The exposition is OK, but not great. The discussion of the various weight sampling schemes is still somewhat confusing to follow, and though it has several explanatory figures, could use more and/or a better summary of the goal and "big picture" idea of each method before delving into the details.

POT should be defined *before* it is used. In both Figure 3 and section 4.3, it's defined 2-3 sentences in after having been used multiple times. I know having things be powers of two (or not) happens all the time in graphics, none the less, seeing "POT" without context left me scratching my head until it was explained.` },
          { label: "Technical Soundness", value: `I definitely think the paper is sound. It's one of those "why didn't I think of that" kind of papers, that is clearly going to have a benefit as soon as the idea is clear.

However, I have great objections to the use of the phrase "visually lossless". This is meaningless, and needlessly confusing since it's clearly **not** lossless. Once (in section 5.2), they use the phrase "visually indistinguishable". Use that phrase instead!

Give more information about the nature of the numerical issues mentioned in section 4.6. I have a pretty good idea of what kind of issues would crop up, but these kinds of things can be tricky to get right, so I want to know for sure what the authors experienced, and what (if any) analysis they did to confirm that their numerical index errors are no longer possible.` },
          { label: "Quality of References", value: `The references seem adequate to me. I would probably add Le and Deng, "Two-layer sparse compression of dense-weight blend skinning", from 2013. This paper had a slightly different target and focus, but also included a dictionary and compression of weights

Note that Col19 needs a publication location, and Dee95 is lacking much of the detail on the citation (this one maybe an @article that should be an @inproceedings?)` },
          { label: "Reproducibility", value: "The details are sufficient, and additional source is provided as supplementary material" },
          { label: "Explanation of Recommendation", value: "Overall, I do like this paper. I feel like its biggest problems are in the muddy explanation of the sampling strategies, especially the OSS, since that's the meat of the paper." },
